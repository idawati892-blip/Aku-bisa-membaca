function audio(){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}catch(e){return null;}}
function tone(freq,duration=.12,type='sine',volume=.045,delay=0){const c=audio();if(!c)return;try{const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,c.currentTime+delay);g.gain.setValueAtTime(.0001,c.currentTime+delay);g.gain.exponentialRampToValueAtTime(volume,c.currentTime+delay+.015);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+delay+duration);o.connect(g);g.connect(c.destination);o.start(c.currentTime+delay);o.stop(c.currentTime+delay+duration+.03);}catch(e){}}
function pop(){tone(520,.07,'sine',.025)}function happy(){[523,659,784,1046].forEach((f,i)=>tone(f,.22,'sine',.055,i*.13));}function retrySound(){tone(240,.18,'sine',.035);tone(200,.22,'sine',.025,.13)}function sparkle(){[880,1175,1480,1760].forEach((f,i)=>tone(f,.22,'triangle',.025,i*.07));}
function speak(text,opts={}){if(!('speechSynthesis'in window)||!window.SpeechSynthesisUtterance){toast('Suara belum didukung browser ini.');return;}try{window.speechSynthesis.cancel();const t=String(text||'').trim();if(!t)return;const u=new SpeechSynthesisUtterance(t);u.lang='id-ID';u.rate=opts.rate||.85;u.pitch=opts.pitch||1.1;let vs=window.speechSynthesis.getVoices();let v=vs.find(x=>/^id(-|_)?/i.test(x.lang)||/indones/i.test(x.name));if(v)u.voice=v;window.speechSynthesis.speak(u);}catch(e){toast('Suara belum dapat diputar.');}}

function renderNav(){const nav=$('levelList');if(!nav)return;nav.innerHTML=levels.map((l,i)=>`<button class="level-btn ${state.activeLevel===i+1?'active':''} ${state.completed.includes(i+1)?'done':''}" data-level="${i+1}"><span class="num">${state.completed.includes(i+1)?'✓':l[1]}</span><span>Level ${i+1}<small>${l[0]}</small></span></button>`).join('');nav.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>goLevel(Number(b.dataset.level))));safe('starCount',e=>e.textContent=state.stars);safe('badgeCount',e=>e.textContent=state.badges.length);}

function populateWriteItems(){const cat=$('writeCategory'),sel=$('writeItem');if(!cat||!sel)return;const c=cat.value;writeItems=c==='vowel'?['A','I','U','E','O']:c==='consonant'?alphabet.filter(x=>!vowels.includes(x)):c==='syllable'?matrixCons.flatMap(x=>vowels.map(v=>x+v)):words.map(w=>w[0]);sel.innerHTML=writeItems.map(x=>`<option value="${x}">${x}</option>`).join('');sel.onchange=()=>{writingLetter=sel.value;drawGuide();};writingLetter=writeItems[0]||'A';drawGuide();}

function drawGuide(){if(!canvas||!ctx)return;const w=canvas.width/canvasDpr,h=canvas.height/canvasDpr;ctx.clearRect(0,0,w,h);ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);const top=h*.19,mid=h*.5,base=h*.81;ctx.strokeStyle='#9ac7db';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,top);ctx.lineTo(w,top);ctx.moveTo(0,base);ctx.lineTo(w,base);ctx.stroke();ctx.strokeStyle='#b7c6d0';ctx.setLineDash([7,7]);ctx.beginPath();ctx.moveTo(0,mid);ctx.lineTo(w,mid);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#9bb7c6';ctx.globalAlpha=.25;ctx.textAlign='center';ctx.textBaseline='middle';let fontSize=Math.min(h*.66,w/(Math.max(2,writingLetter.length)*.65));ctx.font=`900 ${fontSize}px Arial, sans-serif`;ctx.fillText(writingLetter,w/2,(top+base)/2);ctx.globalAlpha=1;ctx.lineCap='round';ctx.lineJoin='round';strokes.forEach(s=>{if(s.length<2)return;ctx.strokeStyle=s[0].erase?'#fff':s[0].color;ctx.lineWidth=s[0].erase?28:7;ctx.beginPath();ctx.moveTo(s[0].x,s[0].y);for(let i=1;i<s.length;i++)ctx.lineTo(s[i].x,s[i].y);ctx.stroke();});}

function makeIdealMask(){const w=240,h=240,off=document.createElement('canvas');off.width=w;off.height=h;const c=off.getContext('2d');c.fillStyle='#000';c.textAlign='center';c.textBaseline='middle';c.font=`900 ${writingLetter.length>3?74:writingLetter.length>1?100:170}px Arial`;c.fillText(writingLetter,w/2,h/2);return c.getImageData(0,0,w,h).data;}
function scoreWriting(){if(!canvas)return;const result=$('writingResult');if(!hasDrawn){if(result)result.innerHTML='<div class="feedback bad">Ayo coba menulis dulu di kanvas ya! ✍️</div>';retrySound();return;}const w=240,h=240,ideal=document.createElement('canvas');ideal.width=w;ideal.height=h;const ic=ideal.getContext('2d');ic.fillStyle='#000';ic.textAlign='center';ic.textBaseline='middle';ic.font=`900 ${writingLetter.length>3?74:writingLetter.length>1?100:170}px Arial`;ic.fillText(writingLetter,w/2,h/2);const idealData=ic.getImageData(0,0,w,h).data;const draw=document.createElement('canvas');draw.width=w;draw.height=h;const dc=draw.getContext('2d');const cw=canvas.width/canvasDpr,ch=canvas.height/canvasDpr;dc.scale(w/cw,h/ch);dc.drawImage(canvas,0,0,cw,ch);const d=dc.getImageData(0,0,w,h).data;let target=0,covered=0,ink=0,outside=0;const rad=3;for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;const isTarget=idealData[i+3]>30&&idealData[i]<180;const isInk=d[i+3]>40&&!(d[i]>245&&d[i+1]>245&&d[i+2]>245);if(isTarget){target++;let hit=false;for(let yy=Math.max(0,y-rad);yy<=Math.min(h-1,y+rad)&&!hit;yy++)for(let xx=Math.max(0,x-rad);xx<=Math.min(w-1,x+rad);xx++){const j=(yy*w+xx)*4;if(d[j+3]>40&&!(d[j]>245&&d[j+1]>245&&d[j+2]>245)){hit=true;break;}}if(hit)covered++;}if(isInk){ink++;if(!isTarget)outside++;}}const coverage=covered/Math.max(1,target),precision=ink?Math.max(0,1-outside/ink):0;let score=Math.round(Math.max(0,Math.min(100,coverage*72+precision*28)));if(score<10&&ink>0)score=Math.max(score,Math.round(coverage*70));const stars=score>=85?3:score>=65?2:1;const msg=score>=85?'Luar Biasa! Tulisanmu Sangat Rapi!':score>=65?'Bagus Sekali! Terus Berlatih ya!':'Ayo Coba Sekali Lagi, Pasti Bisa!';state.writingHistory.push({item:writingLetter,score,stars,date:new Date().toISOString()});state.writingBest[writingLetter]=Math.max(state.writingBest[writingLetter]||0,score);state.stars+=stars;if(score>=85&&!state.badges.includes('Jago Nulis'))state.badges.push('Jago Nulis');saveState();renderNav();if(score>=85){happy();confetti();}else if(score>=65){sparkle();}else retrySound();if(result)result.innerHTML=`<div class="activity-panel"><div class="score-row"><div class="score-badge" style="--score-angle:${score*3.6}deg"><span>${score}</span></div><div class="score-info"><h3>${msg}</h3><p>${'⭐'.repeat(stars)} · Akurasi ${score}%</p><div class="progress-track" style="margin-top:9px"><div class="progress-fill" style="width:${score}%"></div></div><p style="margin-top:7px">Jejak goresan: ${Math.round(coverage*100)}% · Ketepatan: ${Math.round(precision*100)}%</p></div></div><div class="row-actions"><button class="soft-btn" id="retryWriting">🔄 Ulangi</button><button class="primary-btn" id="continueWriting">Lanjut Huruf ➜</button></div></div>`;safe('retryWriting',b=>b.addEventListener('click',clearCanvas));safe('continueWriting',b=>b.addEventListener('click',nextWriting));}

function confetti(){for(let i=0;i<42;i++){const e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=['#ffd84d','#65c9f4','#68cf86','#ff9852','#ff8eae','#a78bfa'][i%6];e.style.animationDelay=Math.random()*.8+'s';e.style.transform=`rotate(${Math.random()*360}deg)`;document.body.appendChild(e);setTimeout(()=>e.remove(),3400);}}
